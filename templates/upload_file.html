<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafer Fault Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            margin:0;
            padding:0;
        }

        .container{
            width:450px;
            margin:100px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }

        h2{
            color:#333;
        }

        input[type=file]{
            width:100%;
            padding:10px;
            margin:20px 0;
        }

        input[type=submit]{
            background:#007bff;
            color:white;
            border:none;
            padding:10px 25px;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        input[type=submit]:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Wafer Fault Prediction</h2>

    <form action="/predict" method="POST" enctype="multipart/form-data">

        <input type="file" name="file" accept=".csv" required>

        <br>

        <input type="submit" value="Predict">

    </form>

</div>

</body>
</html>
